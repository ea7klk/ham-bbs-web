name: Docker image

# Delivery is: test, build and publish the image to GHCR here, then pin the
# published digest in the GitOps repository (spainip/infra,
# fleet/managed-apps.yaml) that Fleet reconciles onto the k3s cluster.
#
# The deployment is a Kubernetes Deployment pinned to an image digest with
# `correctDrift` enabled. There is no Docker daemon on the cluster host, so no
# job here may assume `docker compose`, and a `docker compose up` or
# `kubectl set image` on the host would be reverted by Fleet. Bumping the digest
# in the GitOps repository is the only durable way to ship a release.

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  release:
    types:
      - published
  # Bootstrap and rebuild path: a release whose tag predates this workflow can
  # be rebuilt from a branch or tag by hand. `version` is used as the image tag.
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish (for example v1.17)
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

# A superseded branch or pull-request run is cancelled so the queue cannot fill
# with stale work. A release build is never cancelled: the image it publishes is
# what the deployment pins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (github.event.action != 'closed' || github.event.pull_request.merged == true))
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage reports
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## Go coverage"
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: |
            coverage.out
            coverage.txt
            coverage.html
          if-no-files-found: error

  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tests
    # `packages: write` is what lets the job's GITHUB_TOKEN push to GHCR; the
    # workflow default is contents:read only.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ env.IMAGE_VERSION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ env.IMAGE_VERSION }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Log in to GHCR
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch and pull-request runs build without publishing, so a broken
      # Dockerfile is caught before a release depends on it.
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published digest
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## Published image"
            echo
            echo '```'
            echo "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Pin this digest in the GitOps repository Fleet reconciles:"
            echo '`spainip/infra` -> `fleet/managed-apps.yaml`.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Fleet deploys from spainip/infra with `correctDrift` enabled, so the only
  # durable way to ship a release is to bump the digest-pinned image reference
  # there. This job does that automatically when an `INFRA_REPO_TOKEN` secret (a
  # fine-grained PAT with contents:write on spainip/infra) is configured, and
  # reports the digest for a manual pin otherwise.
  pin:
    name: Pin image digest in GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    env:
      INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      IMAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Report missing deployment credential
        if: env.INFRA_REPO_TOKEN == ''
        run: |
          {
            echo "### Image published, GitOps pin skipped"
            echo
            echo "No \`INFRA_REPO_TOKEN\` secret is configured, so"
            echo "\`spainip/infra\` was not updated automatically."
            echo
            echo "Pin this reference in \`fleet/managed-apps.yaml\`:"
            echo
            echo '```'
            echo "${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=GitOps pin skipped::Set INFRA_REPO_TOKEN to automate the digest bump."

      - name: Check out GitOps repository
        if: env.INFRA_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: spainip/infra
          token: ${{ env.INFRA_REPO_TOKEN }}
          path: gitops

      - name: Pin published digest
        if: env.INFRA_REPO_TOKEN != ''
        working-directory: gitops
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys

          path = "fleet/managed-apps.yaml"
          image_name = os.environ["IMAGE_NAME"]
          digest = os.environ["IMAGE_DIGEST"]
          version = os.environ["IMAGE_VERSION"]

          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest or ""):
              sys.exit(f"unexpected digest: {digest!r}")

          with open(path, encoding="utf-8") as handle:
              original = handle.read()

          pattern = re.compile(re.escape(image_name) + r"@sha256:[0-9a-f]{64}")
          updated, count = pattern.subn(f"{image_name}@{digest}", original)
          if count == 0:
              sys.exit(f"no digest-pinned reference to {image_name} in {path}")
          if updated == original:
              print(f"{path} already pins {digest}; nothing to do")
              raise SystemExit(0)

          with open(path, "w", encoding="utf-8") as handle:
              handle.write(updated)
          print(f"pinned {count} reference(s) to {digest} for {version}")
          PY
          if git diff --quiet -- fleet/managed-apps.yaml; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fleet/managed-apps.yaml
          git commit -m "chore(ham-bbs-web): pin image to ${IMAGE_VERSION} (${IMAGE_DIGEST:0:19})"
          git push
