name: Docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  release:
    types:
      - published

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  tests:
    name: Go tests
    runs-on: self-hosted
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
       (github.event.action != 'closed' || github.event.pull_request.merged == true))
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Go tests
        run: go test ./...

  build:
    name: Build and publish Docker image
    runs-on: self-hosted
    needs: tests
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Docker host
    runs-on: self-hosted
    needs: build
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_COMPOSE_FILE: /opt/stacks/ham-bbs/docker-compose.yaml
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'bbs' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and redeploy service
        run: |
          compose_dir="$(dirname "$DEPLOY_COMPOSE_FILE")"
          docker compose --project-directory "$compose_dir" -f "$DEPLOY_COMPOSE_FILE" pull "$DEPLOY_SERVICE"
          docker compose --project-directory "$compose_dir" -f "$DEPLOY_COMPOSE_FILE" up -d --no-deps "$DEPLOY_SERVICE"
